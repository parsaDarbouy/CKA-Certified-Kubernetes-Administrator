apiVersion: v1
kind: Pod
metadata:
  name: logger
  namespace: exercise-02
spec:
  initContainers:
    - name: log-agent
      image: busybox:1.36
      restartPolicy: Always
      command: ["tail", "-F", "/var/log/app/app.log"]
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/app
  containers:
    
    - name: app
      image: busybox:1.36
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/app
      command: ["sh","-c", "while true; do echo 'Hello' >> /var/log/app/app.log; sleep 3; done"]

  volumes:
    - name: log-volume
      emptyDir: {}
