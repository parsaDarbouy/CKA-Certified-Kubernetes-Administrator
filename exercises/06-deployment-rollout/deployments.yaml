apiVersion: apps/v1
kind: Deployment
metadata: 
  name: webapp
  namespace: exercise-06
spec: 
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
       - name: app
         image: nginx:1.29

