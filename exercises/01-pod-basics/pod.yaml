apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: exercise-01
  labels:
    version: v1
    app: web
    tier: frontend
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
